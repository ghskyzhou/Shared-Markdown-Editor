<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 共享 Markdown 编辑器</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      color: #202124;
      background: #f7f7f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
                   "Microsoft YaHei", sans-serif;
    }
    .login-card {
      width: min(100%, 360px);
      padding: 30px;
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 14px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.07);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    p {
      margin: 0 0 22px;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }
    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      outline: none;
      font: inherit;
    }
    input:focus {
      border-color: #71717a;
      box-shadow: 0 0 0 3px rgba(113, 113, 122, 0.12);
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 10px 14px;
      color: #fff;
      background: #27272a;
      border: 0;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #18181b; }
    .error {
      margin: 0 0 14px;
      padding: 9px 10px;
      color: #b42318;
      background: #fef3f2;
      border-radius: 7px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>共享 Markdown 编辑器</h1>
    <p>请输入访问密钥后继续。登录状态会保留一个月。</p>
    {% if error %}
      <div class="error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="password">访问密钥</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" autofocus required>
      <button type="submit">进入编辑器</button>
    </form>
  </main>
</body>
</html>
